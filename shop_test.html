<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend-Backend Integration Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .btn { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 10px 5px; }
        .btn:hover { background: #0056b3; }
        .form-group { margin: 15px 0; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .result { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Frontend-Backend Integration Test</h1>
        
        <!-- Login Section -->
        <div class="section">
            <h2>1. Login (Get Token)</h2>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" value="admin@example.com">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" value="admin123">
            </div>
            <button class="btn" onclick="login()">Login</button>
            <div id="login-result" class="result" style="display: none;"></div>
        </div>

        <!-- Create Shop Section -->
        <div class="section">
            <h2>2. Create Shop</h2>
            <div class="form-group">
                <label>Shop Name:</label>
                <input type="text" id="shop-name" placeholder="Enter shop name">
            </div>
            <div class="form-group">
                <label>Location:</label>
                <input type="text" id="shop-location" placeholder="Enter shop location">
            </div>
            <button class="btn" onclick="createShop()">Create Shop</button>
            <div id="shop-result" class="result" style="display: none;"></div>
        </div>

        <!-- View Shops Section -->
        <div class="section">
            <h2>3. View All Shops</h2>
            <button class="btn" onclick="viewShops()">View All Shops</button>
            <div id="shops-result" class="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Base API URL
        const API_URL = 'http://localhost:8000/api';

        // Show results
        function showResult(elementId, message, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = `result ${isSuccess ? 'success' : 'error'}`;
            element.innerHTML = message;
        }

        // Login function
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    showResult('login-result', '✅ Login successful! Token saved.', true);
                } else {
                    showResult('login-result', `❌ Login failed: ${data.message}`, false);
                }
            } catch (error) {
                showResult('login-result', `❌ Network error: ${error.message}`, false);
            }
        }

        // Create Shop function
        async function createShop() {
            const token = localStorage.getItem('token');
            if (!token) {
                showResult('shop-result', '❌ Please login first!', false);
                return;
            }

            const shopName = document.getElementById('shop-name').value;
            const location = document.getElementById('shop-location').value;

            if (!shopName || !location) {
                showResult('shop-result', '❌ Please fill in all fields!', false);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/shop/createShop`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name: shopName, location })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('shop-result', `✅ Shop created successfully! ID: ${data.shop.id}`, true);
                    document.getElementById('shop-name').value = '';
                    document.getElementById('shop-location').value = '';
                } else {
                    showResult('shop-result', `❌ Create failed: ${data.message}`, false);
                }
            } catch (error) {
                showResult('shop-result', `❌ Network error: ${error.message}`, false);
            }
        }

        // View Shops function
        async function viewShops() {
            const token = localStorage.getItem('token');
            if (!token) {
                showResult('shops-result', '❌ Please login first!', false);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/shop/getAllShop`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    const shopsList = Array.isArray(data) ? data : [data];
                    let html = '<h3>Shops:</h3>';
                    shopsList.forEach(shop => {
                        html += `
                            <div style="padding: 10px; margin: 5px 0; background: #f0f0f0; border-radius: 5px;">
                                <strong>Name:</strong> ${shop.name}<br>
                                <strong>Location:</strong> ${shop.location}<br>
                                <strong>Status:</strong> ${shop.status}<br>
                                <strong>ID:</strong> ${shop.id}<br>
                                <strong>Created:</strong> ${new Date(shop.createdAt).toLocaleString()}
                            </div>
                        `;
                    });
                    showResult('shops-result', html, true);
                } else {
                    showResult('shops-result', `❌ Failed to fetch shops: ${data.message}`, false);
                }
            } catch (error) {
                showResult('shops-result', `❌ Network error: ${error.message}`, false);
            }
        }
    </script>
</body>
</html>
