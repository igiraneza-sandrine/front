<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — ShopAPI</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --primary: #6366f1;
      --primary-soft: #eef2ff;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-gray: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 12px;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      margin: 0;
      line-height: 1.5;
    }

    /* --- Navigation --- */
    .navbar {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar-logo {
      font-weight: 800;
      font-size: 1.4rem;
      text-decoration: none;
      color: var(--text-dark);
      letter-spacing: -1px;
    }

    .navbar-logo span { color: var(--primary); }

    /* --- Layout Container --- */
    .dashboard-container {
      max-width: 1200px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    .header-section { margin-bottom: 2.5rem; }
    .header-section h1 { font-size: 2rem; font-weight: 800; margin: 0; }
    .header-section p { color: var(--text-gray); margin-top: 5px; }

    /* --- Stats Section --- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .icon-box {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-info h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-gray); margin: 0; }
    .stat-info .value { font-size: 1.75rem; font-weight: 800; margin: 2px 0 0 0; }

    /* --- Table Card --- */
    .data-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid #f1f5f9;
      overflow: hidden;
    }

    .card-header {
      padding: 1.5rem;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 320px;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.8rem;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
    .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-gray); }

    /* --- User Table --- */
    .table-responsive { overflow-x: auto; }
    .user-table { width: 100%; border-collapse: collapse; min-width: 800px; }
    .user-table th {
      background: #f8fafc;
      text-align: left;
      padding: 1rem 1.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-gray);
      text-transform: uppercase;
    }

    .user-table td { padding: 1rem 1.5rem; border-bottom: 1px solid #f1f5f9; }
    .user-table tr:last-child td { border-bottom: none; }
    .user-table tr:hover { background: #fdfdfd; }

    .user-cell { display: flex; align-items: center; gap: 12px; }
    .user-avatar {
      width: 38px; height: 38px; border-radius: 50%; background: var(--primary-soft); color: var(--primary);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;
    }

    .badge {
      padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: capitalize;
    }
    .badge-customer { background: #ecfdf5; color: #065f46; }
    .badge-seller { background: #eff6ff; color: #1e40af; }

    .btn-action {
      background: none; border: 1px solid #f1f5f9; padding: 8px; border-radius: 8px; cursor: pointer; color: var(--text-gray);
      transition: all 0.2s;
    }
    .btn-action:hover { color: var(--danger); border-color: #fee2e2; background: #fff5f5; }

    @media (max-width: 640px) {
      .hide-mobile { display: none; }
      .search-box { max-width: 100%; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="../index.htm" class="navbar-logo">Shop<span>API</span></a>
    <div id="nav-user-area"></div>
  </nav>

  <div class="dashboard-container">
    <div class="header-section">
      <h1>User Directory</h1>
      <p>View and manage all registered accounts across the platform.</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="icon-box" style="background: #eef2ff; color: #6366f1;">
          <i data-lucide="users"></i>
        </div>
        <div class="stat-info">
          <h3>Total Members</h3>
          <div class="value" id="stat-total">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon-box" style="background: #ecfdf5; color: #10b981;">
          <i data-lucide="shopping-cart"></i>
        </div>
        <div class="stat-info">
          <h3>Customers</h3>
          <div class="value" id="stat-customers">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon-box" style="background: #fff7ed; color: #f59e0b;">
          <i data-lucide="store"></i>
        </div>
        <div class="stat-info">
          <h3>Sellers</h3>
          <div class="value" id="stat-sellers">0</div>
        </div>
      </div>
    </div>

    <div class="data-card">
      <div class="card-header">
        <div style="font-weight: 700; font-size: 1.1rem;">All Accounts</div>
        <div class="search-box">
          <i data-lucide="search" size="18"></i>
          <input type="text" id="search-input" placeholder="Search by name or email..." oninput="filterUsers()">
        </div>
      </div>

      <div class="table-responsive">
        <table class="user-table" id="users-table">
          <thead>
            <tr>
              <th>Member</th>
              <th class="hide-mobile">Contact Info</th>
              <th>Location</th>
              <th>Status</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            </tbody>
        </table>
      </div>

      <div id="empty-state" style="display:none; text-align: center; padding: 4rem 1rem;">
        <div style="background: #f8fafc; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
          <i data-lucide="search-x" style="color: #94a3b8;"></i>
        </div>
        <h3 style="margin: 0; font-size: 1.1rem;">No users found</h3>
        <p style="color: var(--text-gray); margin-top: 4px;">Try adjusting your search filters.</p>
      </div>
    </div>
  </div>

  <div id="toast-wrap"></div>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script>
    // Initialize Icons
    lucide.createIcons();
    requireLogin();

    var allUsers = [];

    function getInitials(name) {
      if (!name) return '?';
      return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
    }

    function renderUsers(users) {
      const tbody = document.getElementById('users-tbody');
      const emptyState = document.getElementById('empty-state');
      const table = document.getElementById('users-table');

      if (users.length === 0) {
        table.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      table.style.display = 'table';
      emptyState.style.display = 'none';

      tbody.innerHTML = users.map(u => `
        <tr>
          <td>
            <div class="user-cell">
              <div class="user-avatar">${getInitials(u.fullName)}</div>
              <div>
                <div style="font-weight: 600; color: var(--text-dark);">${u.fullName || 'N/A'}</div>
                <div style="font-size: 0.75rem; color: var(--text-gray);">UID: ${u._id.slice(-6)}</div>
              </div>
            </div>
          </td>
          <td class="hide-mobile">
            <div style="font-size: 0.85rem; font-weight: 500;">${u.email}</div>
            <div style="font-size: 0.75rem; color: var(--text-gray);">${u.phoneNumber || 'No phone'}</div>
          </td>
          <td style="font-size: 0.85rem;">${u.location || '—'}</td>
          <td>
            <span class="badge badge-${(u.type || 'customer')}">${u.type || 'customer'}</span>
          </td>
          <td style="text-align: right;">
            <button class="btn-action" onclick="deleteUser('${u._id}')">
              <i data-lucide="trash-2" size="16"></i>
            </button>
          </td>
        </tr>
      `).join('');

      lucide.createIcons();
    }

    function filterUsers() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = allUsers.filter(u => 
        (u.fullName || '').toLowerCase().includes(q) || 
        (u.email || '').toLowerCase().includes(q)
      );
      renderUsers(filtered);
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = allUsers.length;
      document.getElementById('stat-customers').textContent = allUsers.filter(u => u.type === 'customer' || !u.type).length;
      document.getElementById('stat-sellers').textContent = allUsers.filter(u => u.type === 'seller').length;
    }

    function deleteUser(id) {
      if (!confirm('Are you sure you want to delete this account?')) return;
      api.removeUser(id).then(() => {
        allUsers = allUsers.filter(u => u._id !== id);
        renderUsers(allUsers);
        updateStats();
      });
    }

    // Initial Load
    api.getAllusers().then(data => {
      allUsers = Array.isArray(data) ? data : (data.users || []);
      updateStats();
      renderUsers(allUsers);
    });
  </script>
</body>
</html>
