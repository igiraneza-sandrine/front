<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — ShopAPI</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --error-bg: #fef2f2;
      --error-text: #b91c1c;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Decorative Background */
    .bg-circle {
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(79, 70, 229, 0.08);
      filter: blur(100px);
      border-radius: 50%;
      z-index: -1;
    }

    .auth-box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 650px; /* Wider for 2-column layout */
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text-main);
    }

    .auth-logo span { color: var(--primary); }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* Form Grid System */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 24px;
    }

    .form-group {
      margin-bottom: 4px;
    }

    .full-width { grid-column: span 2; }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 11px 14px;
      background: #fcfdfe;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius);
      font-size: 0.95rem;
      color: var(--text-main);
      transition: all 0.2s ease;
      outline: none;
    }

    .form-group input:focus, 
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
      background: #fff;
    }

    /* Alert Styling */
    .form-error {
      background: var(--error-bg);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      margin-bottom: 24px;
      display: none;
      border: 1px solid rgba(185, 28, 28, 0.1);
      align-items: center;
      gap: 10px;
    }

    /* Action Buttons */
    .btn-register {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-register:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin: 20px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }

    .divider:not(:empty)::before { margin-right: 1em; }
    .divider:not(:empty)::after { margin-left: 1em; }

    /* Mobile Responsive */
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
      .auth-box { padding: 30px 20px; }
    }
  </style>
</head>
<body>

  <div class="bg-circle" style="top: -100px; right: -100px;"></div>
  <div class="bg-circle" style="bottom: -100px; left: -100px; background: rgba(16, 185, 129, 0.05);"></div>

  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-logo">Shop<span>API</span></div>
      <p class="auth-subtitle">Join us to start managing your marketplace</p>
    </div>

    <div class="form-error" id="reg-error">
      <i data-lucide="alert-circle" size="18"></i>
      <span id="error-message">Please fill in all required fields.</span>
    </div>

    <div class="form-grid">
      
      <div class="form-group full-width">
        <label>Full Name *</label>
        <input type="text" id="reg-name" placeholder="John Felix"/>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="reg-email" placeholder="jane@example.com"/>
      </div>

      <div class="form-group">
        <label>Phone Number *</label>
        <input type="tel" id="reg-phone" placeholder="+123 456..."/>
      </div>

      <div class="form-group">
        <label>Location *</label>
        <input type="text" id="reg-location" placeholder="e.g. Kigali"/>
      </div>

      <div class="form-group">
        <label>Age *</label>
        <input type="number" id="reg-age" placeholder="25" min="1"/>
      </div>

      <div class="form-group">
        <label>Date of Birth *</label>
        <input type="date" id="reg-dob"/>
      </div>

      <div class="form-group">
        <label>Gender *</label>
        <select id="reg-gender">
          <option value="">Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Account Type *</label>
        <select id="reg-type">
          <option value="customer">Customer</option>
          <option value="seller">Seller</option>
        </select>
      </div>

      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="reg-password" placeholder="Min 4 characters"
          onkeydown="if(event.key==='Enter') handleRegister()"/>
      </div>

    </div>

    <button class="btn-register" id="btn-register" onclick="handleRegister()">
      <span>Create Account</span>
      <i data-lucide="user-plus" size="18"></i>
    </button>

    <div class="divider">or</div>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in here</a>
    </div>
  </div>

  <script src="../public/js/auth.js"></script>
  <script>
    // Initialize Icons
    lucide.createIcons();
    requireGuest();

    /**
     * Enhanced Register Handler
     */
    async function handleRegister() {
      const btn = document.getElementById('btn-register');
      const errBox = document.getElementById('reg-error');
      
      // Simple visual validation before calling your auth.js
      const inputs = document.querySelectorAll('.form-group input, .form-group select');
      let valid = true;
      inputs.forEach(i => {
        if(!i.value) valid = false;
      });

      if(!valid) {
        showError("All fields marked with * are required.");
        return;
      }

      // Button loading state
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span>Creating Account...</span>`;

      try {
        // Calls the existing register() function from your auth.js
        await register(); 
      } catch (err) {
        showError(err.message || "Registration failed. Try again.");
        btn.disabled = false;
        btn.innerHTML = originalHTML;
        lucide.createIcons();
      }
    }

    function showError(msg) {
      const errBox = document.getElementById('reg-error');
      document.getElementById('error-message').innerText = msg;
      errBox.style.display = 'flex';
    }
  </script>
</body>
</html>
